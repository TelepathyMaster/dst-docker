name: Docker CI and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check and test scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          shellcheck -x scripts/*.sh tests/*.sh
          tests/runtime.sh
          tests/release.sh
          docker compose config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: dst:ci
      - name: Verify default user and tools
        run: |
          docker run --rm --entrypoint bash dst:ci -ec '
            test "$(id -u)" = 1000
            test "$(id -g)" = 1000
            test -w /opt/dst && test -w /data
            test -x /usr/local/share/steamcmd/steamcmd.sh
            test -x /usr/local/share/steamcmd/linux32/steamcmd
            test -x /usr/bin/tini
          '
      - name: Verify Docker signal forwarding and custom UID
        run: tests/docker.sh dst:ci

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # Serialize all releases: older versions must never move latest backwards.
    concurrency:
      group: dockerhub-publish
      cancel-in-progress: false
    env:
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify immutable tags and select latest
        id: release
        shell: bash
        run: scripts/release-tags.sh "${GITHUB_REF_NAME#v}" "$DOCKERHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
