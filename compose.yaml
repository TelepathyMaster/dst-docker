x-dst: &dst
  image: dst:local
  build:
    context: .
  stop_grace_period: 120s
  networks: [dst]
  environment: &dst-environment
    CLUSTER_NAME: Cluster_1

services:
  updater:
    <<: *dst
    restart: "no"
    command: update
    environment:
      <<: *dst-environment
      SHARD: Master
    volumes:
      - dst-game:/opt/dst
      - ./data:/data
      - ./examples/dedicated_server_mods_setup.lua:/config/dedicated_server_mods_setup.lua:ro
  master:
    <<: *dst
    restart: unless-stopped
    command: run
    depends_on:
      updater:
        condition: service_completed_successfully
    environment:
      <<: *dst-environment
      SHARD: Master
    volumes:
      - dst-game:/opt/dst:ro
      - ./data:/data
      - ./examples/dedicated_server_mods_setup.lua:/config/dedicated_server_mods_setup.lua:ro
    ports:
      - "10999:10999/udp"
  caves:
    <<: *dst
    restart: unless-stopped
    command: run
    depends_on:
      updater:
        condition: service_completed_successfully
    environment:
      <<: *dst-environment
      SHARD: Caves
    volumes:
      - dst-game:/opt/dst:ro
      - ./data:/data
      - ./examples/dedicated_server_mods_setup.lua:/config/dedicated_server_mods_setup.lua:ro
    ports:
      - "10998:10998/udp"

volumes:
  dst-game:
networks:
  dst:
    driver: bridge
